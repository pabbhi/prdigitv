<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body{font-family:Arial;background:#f4f6f8;display:flex;justify-content:center;align-items:center;height:100vh;}
form{background:white;padding:30px;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,0.1);width:300px;}
input{width:100%;padding:8px;margin:10px 0;border-radius:4px;border:1px solid #ccc;}
button{width:100%;padding:10px;background:#6366f1;color:white;border:none;border-radius:4px;cursor:pointer;}
button:hover{background:#4f46e5;}
.message{color:red;margin-top:5px;text-align:center;}
</style>
</head>
<body>
<form id="loginForm">
<h3>Login</h3>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
<p class="message" id="msg"></p>
<p><a href="reset.html">Forgot Password?</a></p>
</form>

<script>
const API="https://script.google.com/macros/s/AKfycbyQSjmfTBC7JtuzvIJSkcsuzcvbGE5WBnoD-2WRiK5Chl82lM__1B4ZpUufV71PgEvMxQ/exec";

document.getElementById('loginForm').onsubmit = function(e){
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  fetch(API,{
    method:'POST',
    body: new URLSearchParams({action:'login', email:email, password:password})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.status==="success"){
      localStorage.setItem('role',data.role);
      localStorage.setItem('email',data.email);
      if(data.role==='Admin') window.location='admin.html';
      else if(data.role==='Support') window.location='support.html';
    }else{
      document.getElementById('msg').innerText=data.msg;
    }
  });
};
</script>
</body>
</html>
