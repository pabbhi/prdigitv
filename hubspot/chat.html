<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
body{font-family:Arial;margin:20px;}
#messages{border:1px solid #ccc;height:300px;overflow-y:auto;padding:10px;margin-bottom:10px;}
input{width:80%;padding:8px;}
button{padding:8px;}
.message{margin:5px 0;}
.sender{font-weight:bold;}
</style>
</head>
<body>
<h3>Chat with Support</h3>
<div id="messages"></div>
<input type="text" id="msgInput" placeholder="Type message">
<button id="sendBtn">Send</button>

<script>
const API="https://script.google.com/macros/s/AKfycbxoA7zgz3LWm-KIfj0GWLoumThNFy2ME4IYkIJVOoDjm0KBdFGmvZ44WhcnvQFM1k023A/exec"; // Replace with your Apps Script URL
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');
let leadId;

if(!token){document.body.innerHTML="<h3>Invalid link</h3>";}

// Load lead by token
function loadLead(){
  fetch(API,{method:'POST',body:new URLSearchParams({action:'getLeadByToken', token:token})})
  .then(res=>res.json()).then(lead=>{
    if(!lead){document.body.innerHTML="<h3>Invalid link</h3>"; return;}
    leadId = lead.id;
    loadMessages();
    setInterval(loadMessages,2000);
  });
}

// Load chat messages
function loadMessages(){
  fetch(API,{method:'POST',body:new URLSearchParams({action:'getMessages', leadId:leadId})})
  .then(res=>res.json()).then(msgs=>{
    const div = document.getElementById('messages');
    div.innerHTML='';
    msgs.forEach(m=>{
      const p=document.createElement('div');
      p.className='message';
      p.innerHTML='<span class="sender">'+m.sender+': </span>'+m.message;
      div.appendChild(p);
    });
    div.scrollTop = div.scrollHeight;
  });
}

// Send message
sendBtn.onclick=()=>{
  const text = msgInput.value;
  if(!text) return;
  fetch(API,{method:'POST',body:new URLSearchParams({action:'sendMessage',leadId:leadId,sender:'Customer',message:text})})
  .then(()=>{msgInput.value=''; loadMessages();});
}

loadLead();
</script>
</body>
</html>
