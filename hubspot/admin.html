<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}
.sidebar{width:220px;background:#1f2937;color:white;height:100vh;position:fixed;padding-top:20px;}
.sidebar a{display:block;color:white;padding:15px 20px;text-decoration:none;}
.sidebar a:hover{background:#374151;}
.submenu{max-height:0;overflow:hidden;background:#374151;margin-left:10px;transition:max-height 0.3s ease;}
.submenu.open{max-height:200px;}
.submenu a{padding-left:30px;}
.main{margin-left:220px;padding:20px;}
header{display:flex;justify-content:space-between;margin-bottom:20px;}
button{padding:6px 12px;background:#ef4444;color:white;border:none;border-radius:4px;cursor:pointer;}
.dashboard{display:flex;gap:20px;}
.card{background:white;padding:20px;border-radius:8px;flex:1;box-shadow:0 0 5px rgba(0,0,0,0.1);}
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;}
.modal{display:none;position:fixed;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;}
.modal-content{background:white;padding:20px;border-radius:8px;width:400px;}
input,select,textarea{width:100%;margin:5px 0;padding:6px;}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <a href="#" id="dashboardLink">Dashboard</a>
  <a href="#" id="leadsLink">Leads</a>

  <div id="contactsWrapper">
    <a href="#" id="contactsToggle">Contacts ▾</a>
    <div class="submenu" id="contactsSubmenu">
      <a href="#" id="createContactLink">Create Contact</a>
      <a href="#" id="importContactLink">Import Contacts</a>
    </div>
  </div>

  <a href="#" id="logoutBtn">Logout</a>
</div>

<div class="main">
<header>
<h2>Admin Dashboard</h2>
<button id="topLogoutBtn">Logout</button>
</header>

<!-- Dashboard -->
<div id="dashboardSection" class="dashboard">
  <div class="card">Total Leads: <span id="totalLeads">0</span></div>
  <div class="card">New Leads: <span id="newLeads">0</span></div>
  <div class="card">Contacted: <span id="contactedLeads">0</span></div>
  <div class="card">Closed: <span id="closedLeads">0</span></div>
</div>

<!-- Leads -->
<div id="leadsSection" style="display:none;">
  <table id="leadsTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Email</th>
        <th>Business</th><th>Budget</th>
        <th>Status</th><th>Owner</th>
        <th>Date</th><th>Notes</th><th>Chat</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Create Contact -->
<div id="createContactForm" style="display:none;">
  <h3>Create Contact</h3>
  <input id="contactName" placeholder="Name">
  <input id="contactEmail" placeholder="Email">
  <input id="contactBusiness" placeholder="Business">
  <input id="contactBudget" placeholder="Budget">
  <select id="contactOwner"></select>
  <button id="saveContactBtn">Save</button>
  <p id="contactMsg"></p>
</div>

<!-- Import CSV -->
<div id="importContactForm" style="display:none;">
  <h3>Import CSV</h3>
  <input type="file" id="contactsFile">
  <button id="importContactsBtn">Upload</button>
</div>

<!-- Lead Modal -->
<div class="modal" id="leadModal">
  <div class="modal-content">
    <span id="closeLeadModal">X</span>
    <h3>Edit Lead</h3>
    <input id="leadId" type="hidden">
    <input id="leadName" placeholder="Name">
    <input id="leadEmail" placeholder="Email">
    <input id="leadBusiness" placeholder="Business">
    <input id="leadBudget" placeholder="Budget">
    <select id="leadStatus">
      <option>New Lead</option>
      <option>Contacted</option>
      <option>Closed</option>
    </select>
    <select id="leadOwner"></select>
    <input id="leadDate" type="datetime-local">
    <textarea id="leadNotes" placeholder="Notes"></textarea>
    <button id="saveLeadBtn">Save</button>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxoA7zgz3LWm-KIfj0GWLoumThNFy2ME4IYkIJVOoDjm0KBdFGmvZ44WhcnvQFM1k023A/exec"; // replace with your Apps Script URL

// Sidebar submenu toggle
contactsToggle.onclick=e=>{
  e.preventDefault();
  contactsSubmenu.classList.toggle('open');
};
document.addEventListener('click', e=>{
  if(!contactsWrapper.contains(e.target)) contactsSubmenu.classList.remove('open');
});

// Navigation
dashboardLink.onclick=()=>{dashboardSection.style.display='flex'; leadsSection.style.display='none';};
leadsLink.onclick=()=>{dashboardSection.style.display='none'; leadsSection.style.display='block'; loadLeads();};

// Logout
logoutBtn.onclick=topLogoutBtn.onclick=()=>{localStorage.clear(); location='index.html';};

// Fetch users for dropdowns
let users=[];
fetch(API,{method:'POST',body:new URLSearchParams({action:'getUsers'})})
.then(r=>r.json()).then(data=>{users=data; users.forEach(u=>{contactOwner.appendChild(new Option(u.name,u.email)); leadOwner.appendChild(new Option(u.name,u.email));});});

// Load leads
function loadLeads(){
  fetch(API,{method:'POST',body:new URLSearchParams({action:'getLeads'})})
  .then(r=>r.json()).then(data=>{
    const tbody = leadsTable.querySelector('tbody');
    tbody.innerHTML='';
    let total=0,newL=0,contacted=0,closed=0;
    data.slice(1).forEach(r=>{
      total++; if(r[5]=='New Lead') newL++; else if(r[5]=='Contacted') contacted++; else if(r[5]=='Closed') closed++;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${r[0]}</td>
        <td>${r[1]}</td>
        <td>${r[2]}</td>
        <td>${r[3]}</td>
        <td>${r[4]}</td>
        <td>${r[5]}</td>
        <td>${r[6]}</td>
        <td>${new Date(r[7]).toLocaleString()}</td>
        <td>${r[8]}</td>
        <td><a href="${r[9]}" target="_blank">Open Chat</a></td>`;
      tbody.appendChild(tr);
    });
    totalLeads.innerText=total; newLeads.innerText=newL; contactedLeads.innerText=contacted; closedLeads.innerText=closed;
  });
}

// Create contact
createContactLink.onclick=()=>{createContactForm.style.display='block'; importContactForm.style.display='none';};
saveContactBtn.onclick=()=>{
  const token=Math.random().toString(36).substring(2,12);
  const chatLink=location.origin+'/chat.html?token='+token;
  fetch(API,{method:'POST',body:new URLSearchParams({
    action:'addLead',
    name:contactName.value,
    email:contactEmail.value,
    business:contactBusiness.value,
    budget:contactBudget.value,
    owner:contactOwner.value,
    chatLink: chatLink
  })}).then(()=>{contactMsg.innerText="Created!"; loadLeads();});
};

// Import CSV
importContactLink.onclick=()=>{createContactForm.style.display='none'; importContactForm.style.display='block';};
importContactsBtn.onclick=()=>{
  const file=contactsFile.files[0]; if(!file) return alert("Select file");
  const reader=new FileReader();
  reader.onload=e=>{
    e.target.result.split('\n').slice(1).forEach(row=>{
      const [name,email,business,budget]=row.split(',');
      fetch(API,{method:'POST',body:new URLSearchParams({action:'addLead',name,email,business,budget,owner:'',chatLink:''})});
    });
    alert("Imported!"); loadLeads();
  };
  reader.readAsText(file);
};

// Lead modal
closeLeadModal.onclick=()=>leadModal.style.display='none';
saveLeadBtn.onclick=()=>{
  const obj={
    id: leadId.value,
    name: leadName.value,
    email: leadEmail.value,
    business: leadBusiness.value,
    budget: leadBudget.value,
    status: leadStatus.value,
    owner: leadOwner.value,
    date: leadDate.value,
    notes: leadNotes.value
  };
  fetch(API,{method:'POST',body:new URLSearchParams({action:'updateLead',data:JSON.stringify(obj)})})
  .then(()=>{leadModal.style.display='none'; loadLeads();});
};
</script>
</body>
</html>
