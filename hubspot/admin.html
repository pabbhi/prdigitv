<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<style>
body{font-family:Arial;margin:0;padding:0;background:#f4f6f8;}
.sidebar{width:220px;background:#1f2937;color:white;height:100vh;position:fixed;top:0;left:0;padding-top:20px;}
.sidebar a{display:block;color:white;padding:15px 20px;text-decoration:none;}
.sidebar a:hover{background:#374151;}
.sidebar .submenu{display:none;background:#374151;margin-left:10px;}
.sidebar .submenu a{padding-left:30px;}
.main{margin-left:220px;padding:20px;}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
button.logout{padding:6px 12px;background:#ef4444;color:white;border:none;border-radius:4px;cursor:pointer;}
button.logout:hover{background:#dc2626;}
.dashboard{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap;}
.card{background:white;padding:20px;border-radius:8px;flex:1;min-width:150px;box-shadow:0 0 5px rgba(0,0,0,0.1);}
.tab{margin-bottom:20px;}
.tab button{padding:10px 20px;margin-right:5px;border:none;border-radius:4px;cursor:pointer;background:#6366f1;color:white;}
.tab button.active{background:#4f46e5;}
.leads-table, .contacts-table{width:100%;border-collapse:collapse;}
.leads-table th, .leads-table td, .contacts-table th, .contacts-table td{border:1px solid #ccc;padding:8px;text-align:left;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;}
.modal-content{background:white;padding:20px;border-radius:8px;width:400px;position:relative;}
.modal-content input, .modal-content select, .modal-content textarea{width:100%;margin:5px 0;padding:6px;border:1px solid #ccc;border-radius:4px;}
.modal-content button{padding:8px 12px;background:#6366f1;color:white;border:none;border-radius:4px;cursor:pointer;margin-top:10px;}
.modal-content button:hover{background:#4f46e5;}
.close{position:absolute;top:10px;right:10px;cursor:pointer;font-weight:bold;}
.message{color:green;margin-top:5px;}
</style>
</head>
<body>

<div class="sidebar">
  <a href="#" id="dashboardLink">Dashboard</a>
  <a href="#" id="leadsLink">Leads</a>
  <a href="#" id="contactsLink">Contacts</a>
  <div class="submenu" id="contactsSubmenu">
    <a href="#" id="createContactLink">Create Contact</a>
    <a href="#" id="importContactLink">Import Contacts</a>
  </div>
  <a href="#" class="logout" id="logoutBtn">Logout</a>
</div>

<div class="main">
<header>
<h2>Admin Dashboard</h2>
<button class="logout" id="topLogoutBtn">Logout</button>
</header>

<!-- Dashboard Section -->
<div id="dashboardSection" class="dashboard">
  <div class="card">Total Leads: <span id="totalLeads">0</span></div>
  <div class="card">New Leads: <span id="newLeads">0</span></div>
  <div class="card">Contacted: <span id="contactedLeads">0</span></div>
  <div class="card">Closed: <span id="closedLeads">0</span></div>
</div>

<!-- Tabs -->
<div class="tab">
  <button class="active" id="leadsTabBtn">Leads</button>
  <button id="contactsTabBtn">Contacts</button>
</div>

<!-- Leads Section -->
<div id="leadsSection" style="display:none;">
  <table class="leads-table" id="leadsTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Email</th><th>Business</th><th>Budget</th>
        <th>Status</th><th>Owner</th><th>Date</th><th>Notes</th><th>Chat</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Contacts Section -->
<div id="contactsSection" style="display:none;">
  <!-- Create Contact Form -->
  <div id="createContactForm" style="display:none;">
    <h3>Create Contact</h3>
    <input type="text" id="contactName" placeholder="Name">
    <input type="email" id="contactEmail" placeholder="Email">
    <input type="text" id="contactBusiness" placeholder="Business">
    <input type="text" id="contactBudget" placeholder="Budget">
    <select id="contactOwner"></select>
    <button id="saveContactBtn">Save Contact</button>
    <p class="message" id="contactMsg"></p>
  </div>

  <!-- Import Contacts Form -->
  <div id="importContactForm" style="display:none;">
    <h3>Import Contacts (CSV/XLS/XLSX)</h3>
    <input type="file" id="contactsFile">
    <button id="importContactsBtn">Upload</button>
    <p class="message" id="importMsg"></p>
  </div>
</div>

<!-- Lead Modal -->
<div class="modal" id="leadModal">
  <div class="modal-content">
    <span class="close" id="closeLeadModal">&times;</span>
    <h3>Edit Lead</h3>
    <input type="hidden" id="leadId">
    <input type="text" id="leadName" placeholder="Name">
    <input type="email" id="leadEmail" placeholder="Email">
    <input type="text" id="leadBusiness" placeholder="Business">
    <input type="text" id="leadBudget" placeholder="Budget">
    <select id="leadStatus">
      <option>New Lead</option>
      <option>Contacted</option>
      <option>Closed</option>
    </select>
    <select id="leadOwner"></select>
    <input type="datetime-local" id="leadDate">
    <textarea id="leadNotes" placeholder="Notes"></textarea>
    <button id="saveLeadBtn">Save</button>
    <p class="message" id="leadMsg"></p>
  </div>
</div>

<script>
// === CONFIG ===
const API="https://script.google.com/macros/s/AKfycbzerzKY4Vkf5rTgzQpLJGgovg_xwWN2slxvVKiUUekzllahn1wpc3Vj042hWQbcd8dzMQ/exec"; // Apps Script URL
let users=[];

// === LOGOUT ===
document.getElementById('logoutBtn').onclick=document.getElementById('topLogoutBtn').onclick=()=>{
  localStorage.clear();
  window.location='index.html';
};

// === TAB NAVIGATION ===
const leadsTabBtn=document.getElementById('leadsTabBtn');
const contactsTabBtn=document.getElementById('contactsTabBtn');
const leadsSection=document.getElementById('leadsSection');
const contactsSection=document.getElementById('contactsSection');
leadsTabBtn.onclick=()=>{
  leadsSection.style.display='block';
  contactsSection.style.display='none';
  leadsTabBtn.classList.add('active');
  contactsTabBtn.classList.remove('active');
};
contactsTabBtn.onclick=()=>{
  leadsSection.style.display='none';
  contactsSection.style.display='block';
  contactsTabBtn.classList.add('active');
  leadsTabBtn.classList.remove('active');
};

// === SHOW CONTACTS SUBMENU ===
document.getElementById('contactsLink').onmouseover=()=>document.getElementById('contactsSubmenu').style.display='block';
document.getElementById('contactsLink').onmouseout=()=>document.getElementById('contactsSubmenu').style.display='none';

// === FETCH USERS FOR DROPDOWN ===
fetch(API,{method:'POST',body:new URLSearchParams({action:'getUsers'})})
.then(res=>res.json()).then(data=>{
  users=data;
  const ownerSelect=document.getElementById('contactOwner');
  const leadOwnerSelect=document.getElementById('leadOwner');
  users.forEach(u=>{
    const opt=document.createElement('option'); opt.value=u.email; opt.innerText=u.name; ownerSelect.appendChild(opt);
    const opt2=document.createElement('option'); opt2.value=u.email; opt2.innerText=u.name; leadOwnerSelect.appendChild(opt2);
  });
});

// === LOAD LEADS ===
function loadLeads(){
  fetch(API,{method:'POST',body:new URLSearchParams({action:'getLeads'})})
  .then(res=>res.json()).then(data=>{
    const tbody=document.querySelector('#leadsTable tbody');
    tbody.innerHTML='';
    let total=0,newL=0,contacted=0,closed=0;
    data.slice(1).forEach(r=>{
      total++;
      if(r[5]=='New Lead') newL++;
      else if(r[5]=='Contacted') contacted++;
      else if(r[5]=='Closed') closed++;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${r[0]}</td>
        <td class="clickable">${r[1]}</td>
        <td>${r[2]}</td>
        <td>${r[3]}</td>
        <td>${r[4]}</td>
        <td>${r[5]}</td>
        <td>${r[6]}</td>
        <td>${new Date(r[7]).toLocaleString()}</td>
        <td>${r[8]}</td>
        <td><a href="${r[9]}" target="_blank">Open Chat</a></td>`;
      tr.querySelector('.clickable').onclick=()=>openLeadModal(r);
      tbody.appendChild(tr);
    });
    document.getElementById('totalLeads').innerText=total;
    document.getElementById('newLeads').innerText=newL;
    document.getElementById('contactedLeads').innerText=contacted;
    document.getElementById('closedLeads').innerText=closed;
  });
}
loadLeads();

// === LEAD MODAL ===
const leadModal=document.getElementById('leadModal');
const closeLeadModal=document.getElementById('closeLeadModal');
closeLeadModal.onclick=()=>leadModal.style.display='none';
function openLeadModal(row){
  leadModal.style.display='flex';
  document.getElementById('leadId').value=row[0];
  document.getElementById('leadName').value=row[1];
  document.getElementById('leadEmail').value=row[2];
  document.getElementById('leadBusiness').value=row[3];
  document.getElementById('leadBudget').value=row[4];
  document.getElementById('leadStatus').value=row[5];
  document.getElementById('leadOwner').value=row[6];
  document.getElementById('leadDate').value=new Date(row[7]).toISOString().slice(0,16);
  document.getElementById('leadNotes').value=row[8];
}

// === SAVE LEAD ===
document.getElementById('saveLeadBtn').onclick=()=>{
  const obj={
    id: document.getElementById('leadId').value,
    name: document.getElementById('leadName').value,
    email: document.getElementById('leadEmail').value,
    business: document.getElementById('leadBusiness').value,
    budget: document.getElementById('leadBudget').value,
    status: document.getElementById('leadStatus').value,
    owner: document.getElementById('leadOwner').value,
    date: document.getElementById('leadDate').value,
    notes: document.getElementById('leadNotes').value
  };
  fetch(API,{method:'POST',body:new URLSearchParams({action:'updateLead', data:JSON.stringify(obj)})})
  .then(res=>res.json()).then(()=>{
    document.getElementById('leadMsg').innerText="Lead updated!";
    loadLeads();
    setTimeout(()=>{leadModal.style.display='none';document.getElementById('leadMsg').innerText='';},1000);
  });
};

// === CREATE CONTACT FORM ===
document.getElementById('createContactLink').onclick=()=>{
  document.getElementById('createContactForm').style.display='block';
  document.getElementById('importContactForm').style.display='none';
};
document.getElementById('saveContactBtn').onclick=()=>{
  const params={
    name:document.getElementById('contactName').value,
    email:document.getElementById('contactEmail').value,
    business:document.getElementById('contactBusiness').value,
    budget:document.getElementById('contactBudget').value,
    owner:document.getElementById('contactOwner').value
  };
  fetch(API,{method:'POST',body:new URLSearchParams({action:'addLead',...params})})
  .then(res=>res.json()).then(data=>{
    document.getElementById('contactMsg').innerText="Contact created!";
    document.getElementById('contactName').value='';
    document.getElementById('contactEmail').value='';
    document.getElementById('contactBusiness').value='';
    document.getElementById('contactBudget').value='';
    loadLeads();
    setTimeout(()=>{document.getElementById('contactMsg').innerText='';},2000);
  });
};

// === IMPORT CONTACTS FORM ===
document.getElementById('importContactLink').onclick=()=>{
  document.getElementById('createContactForm').style.display='none';
  document.getElementById('importContactForm').style.display='block';
};
document.getElementById('importContactsBtn').onclick=()=>{
  const file=document.getElementById('contactsFile').files[0];
  if(!file){alert("Select a file"); return;}
  const reader=new FileReader();
  reader.onload=(e)=>{
    const lines=e.target.result.split("\n");
    const arr=[];
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(",");
      if(cols.length>=4) arr.push({name:cols[0],email:cols[1],business:cols[2],budget:cols[3],owner:users[0].email});
    }
    fetch(API,{method:'POST',body:new URLSearchParams({action:'bulkUploadLeads',data:JSON.stringify(arr)})})
    .then(res=>res.json()).then(()=>{document.getElementById('importMsg').innerText="Imported!"; loadLeads();});
  };
  reader.readAsText(file);
};
</script>
</body>
</html>
