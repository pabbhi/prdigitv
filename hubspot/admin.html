<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8;}

/* Sidebar */
.sidebar{
  width:220px;background:#1f2937;color:white;height:100vh;
  position:fixed;padding-top:20px;
}
.sidebar a{
  display:block;color:white;padding:15px 20px;text-decoration:none;
}
.sidebar a:hover{background:#374151;}

.submenu{
  max-height:0;
  overflow:hidden;
  background:#374151;
  margin-left:10px;
  transition:max-height 0.3s ease;
}
.submenu.open{max-height:200px;}
.submenu a{padding-left:30px;}

.main{margin-left:220px;padding:20px;}

header{
  display:flex;justify-content:space-between;
  margin-bottom:20px;
}

button{
  padding:6px 12px;background:#ef4444;
  color:white;border:none;border-radius:4px;
  cursor:pointer;
}

/* Cards */
.dashboard{display:flex;gap:20px;}
.card{
  background:white;padding:20px;border-radius:8px;
  flex:1;box-shadow:0 0 5px rgba(0,0,0,0.1);
}

/* Table */
table{width:100%;border-collapse:collapse;margin-top:20px;}
th,td{border:1px solid #ccc;padding:8px;}

/* Modal */
.modal{
  display:none;position:fixed;width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  justify-content:center;align-items:center;
}
.modal-content{
  background:white;padding:20px;border-radius:8px;width:400px;
}
input,select,textarea{
  width:100%;margin:5px 0;padding:6px;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <a href="#" id="dashboardLink">Dashboard</a>
  <a href="#" id="leadsLink">Leads</a>

  <div id="contactsWrapper">
    <a href="#" id="contactsToggle">Contacts ▾</a>
    <div class="submenu" id="contactsSubmenu">
      <a href="#" id="createContactLink">Create Contact</a>
      <a href="#" id="importContactLink">Import Contacts</a>
    </div>
  </div>

  <a href="#" id="logoutBtn">Logout</a>
</div>

<div class="main">

<header>
<h2>Admin Dashboard</h2>
<button id="topLogoutBtn">Logout</button>
</header>

<!-- Dashboard -->
<div id="dashboardSection" class="dashboard">
  <div class="card">Total: <span id="totalLeads">0</span></div>
  <div class="card">New: <span id="newLeads">0</span></div>
  <div class="card">Contacted: <span id="contactedLeads">0</span></div>
  <div class="card">Closed: <span id="closedLeads">0</span></div>
</div>

<!-- Leads -->
<div id="leadsSection" style="display:none;">
  <table id="leadsTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Email</th>
        <th>Business</th><th>Budget</th>
        <th>Status</th><th>Owner</th>
        <th>Date</th><th>Notes</th><th>Chat</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Create Contact -->
<div id="createContactForm" style="display:none;">
  <h3>Create Contact</h3>
  <input id="contactName" placeholder="Name">
  <input id="contactEmail" placeholder="Email">
  <input id="contactBusiness" placeholder="Business">
  <input id="contactBudget" placeholder="Budget">
  <select id="contactOwner"></select>
  <button id="saveContactBtn">Save</button>
  <p id="contactMsg"></p>
</div>

<!-- Import -->
<div id="importContactForm" style="display:none;">
  <h3>Import CSV</h3>
  <input type="file" id="contactsFile">
  <button id="importContactsBtn">Upload</button>
</div>

<!-- Modal -->
<div class="modal" id="leadModal">
  <div class="modal-content">
    <span id="closeLeadModal">X</span>
    <h3>Edit Lead</h3>
    <input id="leadId" type="hidden">
    <input id="leadName">
    <input id="leadEmail">
    <input id="leadBusiness">
    <input id="leadBudget">
    <select id="leadStatus">
      <option>New Lead</option>
      <option>Contacted</option>
      <option>Closed</option>
    </select>
    <select id="leadOwner"></select>
    <input id="leadDate" type="datetime-local">
    <textarea id="leadNotes"></textarea>
    <button id="saveLeadBtn">Save</button>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxlNdL0LD4LbIQrh0f80RtEYu130VPwRiJ4WWL7iw73D_ZtYy0rt-77vB8PLhcdcVJxZg/exec";

/* MENU */
contactsToggle.onclick=(e)=>{
  e.preventDefault();
  contactsSubmenu.classList.toggle('open');
};

document.addEventListener('click',(e)=>{
  if(!contactsWrapper.contains(e.target)){
    contactsSubmenu.classList.remove('open');
  }
});

/* NAV */
dashboardLink.onclick=()=>{
  dashboardSection.style.display='flex';
  leadsSection.style.display='none';
};

leadsLink.onclick=()=>{
  dashboardSection.style.display='none';
  leadsSection.style.display='block';
  loadLeads();
};

/* CREATE CONTACT */
createContactLink.onclick=()=>{
  createContactForm.style.display='block';
  importContactForm.style.display='none';
};

saveContactBtn.onclick=()=>{
  const chatLink=location.origin+'/chat.html?'+Date.now();

  fetch(API,{
    method:'POST',
    body:new URLSearchParams({
      action:'addLead',
      name:contactName.value,
      email:contactEmail.value,
      business:contactBusiness.value,
      budget:contactBudget.value,
      owner:contactOwner.value,
      chatLink
    })
  }).then(()=>{
    contactMsg.innerText="Created!";
    loadLeads();
  });
};

/* IMPORT CSV */
importContactLink.onclick=()=>{
  createContactForm.style.display='none';
  importContactForm.style.display='block';
};

importContactsBtn.onclick=()=>{
  const file=contactsFile.files[0];
  if(!file) return alert("Select file");

  const reader=new FileReader();

  reader.onload=e=>{
    const rows=e.target.result.split('\n');

    rows.forEach((row,i)=>{
      if(i===0) return;

      const [name,email,business,budget]=row.split(',');

      fetch(API,{
        method:'POST',
        body:new URLSearchParams({
          action:'addLead',
          name,email,business,budget,
          owner:'',
          chatLink:''
        })
      });
    });

    alert("Imported!");
    loadLeads();
  };

  reader.readAsText(file);
};

/* LOAD LEADS */
function loadLeads(){
  fetch(API,{
    method:'POST',
    body:new URLSearchParams({action:'getLeads'})
  })
  .then(r=>r.json())
  .then(data=>{
    let tbody=leadsTable.querySelector('tbody');
    tbody.innerHTML='';

    data.slice(1).forEach(r=>{
      let tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${r[0]}</td>
        <td>${r[1]}</td>
        <td>${r[2]}</td>
        <td>${r[3]}</td>
        <td>${r[4]}</td>
        <td>${r[5]}</td>
        <td>${r[6]}</td>
        <td>${r[7]}</td>
        <td>${r[8]}</td>
        <td><a href="${r[9]}" target="_blank">Chat</a></td>
      `;
      tbody.appendChild(tr);
    });
  });
}
</script>

</body>
</html>
